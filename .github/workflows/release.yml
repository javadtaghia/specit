name: Build & Release SPECiT (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v0.1.0-beta)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run engine & API tests
        run: python -m unittest discover -s tests -v

  build-macos:
    name: Build macOS .dmg
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime & packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Build SPECiT macOS .app and .dmg
        run: |
          chmod +x packaging/build_mac_dmg.sh
          PYTHON_BIN=python ./packaging/build_mac_dmg.sh
      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: specit-macos-dmg
          path: dist/SPECiT-*.dmg

  build-windows:
    name: Build Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime & packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Build SPECiT Windows .exe
        shell: pwsh
        run: ./packaging/build_win_exe.ps1
      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: specit-windows-exe
          path: dist/SPECiT-*-Windows-*.exe

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: specit-macos-dmg
          path: release-assets
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: specit-windows-exe
          path: release-assets
      - name: Determine release tag & prerelease flag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *beta* || "$TAG" == *alpha* || "$TAG" == *rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Release with .exe & .dmg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SPECiT ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe
